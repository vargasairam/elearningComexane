      <section class="content_global">
        <header class="wrapper_header">
          <div class="drawer_ttl_header">
            <div class="box_mobile">
              <button class="btn_menu"><i class="ri-menu-line"></i></button>
              <a href="/dashboard.html">
                <img
                  src="imgs/logo.png"
                  alt="Logo AMEH A. C."
                  class="brand_logo"
                />
              </a>
            </div>
            <h2 class="fw-semibold m-0">Mi perfil</h2>
          </div>
          <div class="drawer_options_header">
            <a
              href="/live.html"
              class="btn btn-danger btn_live btn-sm btn_notify"
            >
              <i class="ri-record-circle-fill"></i> <span>En vivo</span>
              <i class="ri-arrow-right-line"></i>
            </a>
            <a href="#" type="button" class="btn btn-light btn-sm btn_info">
              <i class="ri-error-warning-line ri-lg"></i>
            </a>
            <div class="dropdown">
              <button
                class="btn dropdown-toggle"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                <div class="box_info_user">
                  <small class="c_primary">Bienvenido</small>
                  <h6 class="m-0"><span>Dr.</span> Carlos Marin</h6>
                </div>
                <div class="box_photo_user">
                  <i class="ri-user-line"></i>
                </div>
              </button>
              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="/perfil.html"
                    ><i class="ri-user-line"></i> Mi perfil</a
                  >
                </li>
                <li>
                  <a class="dropdown-item" href="#"
                    ><i class="ri-error-warning-line"></i> Ayuda</a
                  >
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <a class="dropdown-item" href="#"
                    ><i class="ri-logout-circle-r-line"></i> Salir</a
                  >
                </li>
              </ul>
            </div>
          </div>
        </header>

        <div class="content_profile">
          <div class="cards mb-5">
            <form class="form_login">
              <div class="d-flex gap-2 justify-content-between">
                <h5 class="">Datos de acceso</h5>
                <div>
                  <button type="button" class="btn btn-warning btn-sm btn_edit">
                    <span>Modificar</span>
                    <i class="ri-pencil-line"></i></button
                  ><button
                    type="button"
                    class="btn btn-primary btn-sm d-none btn_save_info"
                  >
                    <span>Guardar</span> <i class="ri-save-line"></i>
                  </button>
                </div>
              </div>
              <hr />
              <div class="row gx-4 gy-5">
                <div class="col-md-6">
                  <div class="form-floating">
                    <input
                      type="email"
                      class="form-control"
                      id="floatingInput"
                      disabled
                      value="name@example.com"
                    />
                    <label for="floatingInput">Correo electrónico</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-floating">
                    <input
                      type="text"
                      disabled
                      value="**********"
                      class="form-control"
                      id="floatingInput"
                    />
                    <label for="floatingInput">Contraseña</label>
                  </div>
                </div>
              </div>
            </form>
          </div>
          <div class="cards">
            <form class="">
              <div class="d-flex gap-2 justify-content-between">
                <h5 class="">Datos profesionales</h5>
                <div>
                  <button type="button" class="btn btn-warning btn-sm btn_edit">
                    <span>Modificar</span>
                    <i class="ri-pencil-line"></i></button
                  ><button
                    type="button"
                    class="btn btn-primary btn-sm d-none btn_save_info"
                  >
                    <span>Guardar</span> <i class="ri-save-line"></i>
                  </button>
                </div>
              </div>
              <hr />

              <div class="row gx-4 gy-4">
                <div class="col-sm-2">
                  <div class="form-floating">
                    <select
                      disabled
                      class="form-select"
                      id="floatingSelect"
                      aria-label="Prefijo"
                    >
                      <option value="1" selected>Dr.</option>
                      <option value="2">Mr.</option>
                      <option value="3">Mrs.</option>
                    </select>
                  </div>
                </div>
                <div class="col-sm-5">
                  <div class="form-floating">
                    <input
                      disabled
                      type="text"
                      class="form-control"
                      id="floatingInput"
                      placeholder="Nombres(s)"
                    />
                    <label for="floatingInput">Nombres(s)</label>
                  </div>
                </div>
                <div class="col-sm-5">
                  <div class="form-floating">
                    <input
                      disabled
                      type="text"
                      class="form-control"
                      id="floatingInput"
                      placeholder="Apellidos"
                    />
                    <label for="floatingInput">Apellidos</label>
                  </div>
                </div>
                <div class="col-sm-6">
                  <div class="form-floating">
                    <input
                      disabled
                      type="text"
                      class="form-control"
                      id="floatingInput"
                      placeholder="Teléfono"
                    />
                    <label for="floatingInput">Teléfono</label>
                  </div>
                </div>
                <div class="col-sm-6">
                  <div class="form-floating">
                    <select
                      disabled
                      class="form-select"
                      id="selectCategory"
                      aria-label="Prefijo"
                    >
                      <option value="1" selected>Categoría</option>
                      <option value="2">Cat 01</option>
                      <option value="3">Cat 02</option>
                    </select>
                  </div>
                </div>
                <div class="col-sm-6">
                  <div class="form-floating">
                    <input
                      disabled
                      type="text"
                      class="form-control"
                      id="floatingInput"
                      placeholder="País"
                    />
                    <label for="floatingInput">País</label>
                  </div>
                </div>
                <div class="col-sm-6">
                  <div class="form-floating">
                    <input
                      disabled
                      type="text"
                      class="form-control"
                      id="floatingInput"
                      placeholder="Estado"
                    />
                    <label for="floatingInput">Estado</label>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
