<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Plataforma Virtual - AMEH A. C.</title>
    <meta charset="UTF-8" />

    <link rel="shortcut icon" href="imgs/logo.png" />

    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta
      http-equiv="Cache-control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />

     <!-- Chrome, Firefox OS y Opera -->
    <meta name="theme-color" content="#c02a29" />
    <!-- Windows Phone -->
    <meta name="msapplication-navbutton-color" content="#c02a29" />
    <!-- iOS Safari -->
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="author" content="JC Innovations ft. Alex P. Montero" />
    <meta name="application-name" content="Plataforma Virtual - AMEH A. C." />
    <meta name="description" content="Plataforma Virtual - AMEH A. C." />

    <meta property="og:locale" content="es_ES" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Plataforma Virtual - AMEH A. C." />
    <meta property="og:url" content="" />
    <meta property="og:site_name" content="Plataforma Virtual - AMEH A. C." />
    <meta property="og:image" itemprop="image" content="imgs/bg_seo.png" />
    <meta property="og:description" content="Plataforma Virtual - AMEH A. C." />

    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <main
      class="wrapper_main wp_public d-flex justify-content-center align-items-center min-vh-100"
    >
      <section class="wrapper_home">
        <div class="d-flex justify-content-end">
          <button type="button" class="btn btn-primary mb-3">
            <small>
              Descargar el programa 2025 <i class="ri-download-line"></i
            ></small>
          </button>
        </div>
        <div class="content_home">
          <div class="drawer_home w-100">
            <div class="content_login register">
              <div class="text-center">
                <img
                  src="imgs/logo.png"
                  alt="Logo AMEH A. C."
                  class="brand_logo"
                />
              </div>

              <form class="form_register">
                <a href="/index.html" class="btn btn-secondary btn_back"
                  ><i class="ri-arrow-left-line"></i
                ></a>

                <h5 class="text-center my-5">Crear usuario nuevo</h5>

                <div class="row gx-3 gy-4">
                  <div class="col-sm-2">
                    <div class="form-floating">
                      <select
                        class="form-select"
                        id="floatingSelect"
                        aria-label="Prefijo"
                      >
                        <option value="1" selected>Dr.</option>
                        <option value="2">Mr.</option>
                        <option value="3">Mrs.</option>
                      </select>
                    </div>
                  </div>
                  <div class="col-sm-5">
                    <div class="form-floating">
                      <input
                        type="text"
                        class="form-control"
                        id="floatingInput"
                        placeholder="Nombres(s)"
                      />
                      <label for="floatingInput">Nombres(s)</label>
                    </div>
                  </div>
                  <div class="col-sm-5">
                    <div class="form-floating">
                      <input
                        type="text"
                        class="form-control"
                        id="floatingInput"
                        placeholder="Apellidos"
                      />
                      <label for="floatingInput">Apellidos</label>
                    </div>
                  </div>
                  <div class="col-sm-6">
                    <div class="form-floating">
                      <input
                        type="text"
                        class="form-control"
                        id="floatingInput"
                        placeholder="Teléfono"
                      />
                      <label for="floatingInput">Teléfono</label>
                    </div>
                  </div>
                  <div class="col-sm-6">
                    <div class="form-floating">
                      <select
                        class="form-select"
                        id="selectCategory"
                        aria-label="Prefijo"
                      >
                        <option value="1" selected>Categoría</option>
                        <option value="2">Cat 01</option>
                        <option value="3">Cat 02</option>
                      </select>
                    </div>
                  </div>
                  <div class="col-sm-6">
                    <div class="form-floating">
                      <input
                        type="text"
                        class="form-control"
                        id="floatingInput"
                        placeholder="País"
                      />
                      <label for="floatingInput">País</label>
                    </div>
                  </div>
                  <div class="col-sm-6">
                    <div class="form-floating">
                      <input
                        type="text"
                        class="form-control"
                        id="floatingInput"
                        placeholder="Estado"
                      />
                      <label for="floatingInput">Estado</label>
                    </div>
                  </div>
                  <div class="col-sm-6">
                    <div class="form-floating">
                      <input
                        type="text"
                        class="form-control"
                        id="floatingInput"
                        placeholder="Correo electrónico"
                      />
                      <label for="floatingInput">Correo electrónico</label>
                    </div>
                  </div>
                  <div class="col-sm-6">
                    <div class="form-floating">
                      <input
                        type="text"
                        class="form-control"
                        id="floatingInput"
                        placeholder="Contraseña"
                      />
                      <label for="floatingInput">Contraseña</label>
                    </div>
                  </div>
                  <div class="col-12">
                    <button type="submit" class="btn btn-primary w-100">
                      Registrarme
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
          <div class="drawer_hero_home w-100">
            <div
              class="box_hero_home"
              style="background-image: url(./imgs/POSTER_2025.png)"
            ></div>
            <img
              class="picture_hero_home"
              src="./imgs/POSTER_2025.png"
              alt="Agrupación Mexicana para el Estudio de la
              Hematología"
            />
          </div>
        </div>
        <div class="text-end mt-2 foot">
          <small>
            ©2026 Solución desarrollada por
            <a
              class="c_primary"
              target="_blank"
              href="https://jc-innovation.com/"
              >JC Innovation</a
            >. All Rights Reserved.</small
          >
        </div>
      </section>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/usm/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
